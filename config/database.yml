default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  host: <%= ENV['PG_HOST'] %>
  port: <%= ENV['PG_PORT'] %>
  username: <%= ENV['PG_USERNAME'] %>
  password: <%= ENV['PG_PASSWORD'] %>
  database: <%= ENV['PG_DATABASE'] %>

test:
  <<: *default
  host: <%= ENV['PG_HOST'] %>
  port: <%= ENV['PG_PORT'] %>
  username: <%= ENV['PG_USERNAME'] %>
  password: <%= ENV['PG_PASSWORD'] %>
  database: havka_test

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>